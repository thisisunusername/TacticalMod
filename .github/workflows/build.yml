name: Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Fabric Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show environment
        run: |
          java -version
          echo "---- gradle.properties ----"
          cat gradle.properties
          echo "---- java files ----"
          find src -name '*.java' | sort

      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          chmod +x ./gradlew
          ./gradlew build --stacktrace --no-daemon --console=plain 2>&1 | tee /tmp/build.log
          echo "GRADLE_EXIT=${PIPESTATUS[0]}"
          exit ${PIPESTATUS[0]}

      - name: Dump build errors as annotations
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          LOG=/tmp/build.log
          [ -f "$LOG" ] || LOG=build.log
          echo "=================== ERROR LINES ==================="
          grep -nE "error:|错误|> Task .*FAILED|FAILURE:|What went wrong|Could not|Execution failed|Caused by" "$LOG" | head -120 || true
          echo "=================== TAIL 80 ==================="
          tail -n 80 "$LOG" || true
          echo "=================== ANNOTATIONS ==================="
          grep -E "error:" "$LOG" | head -40 | while IFS= read -r line; do
            safe=$(printf '%s' "$line" | tr '\n' ' ' | sed 's/%/%25/g; s/\r//g')
            echo "::error::$safe"
          done || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload artifact (jar)
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tacticalmod-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build/reports/
            build/tmp/compileJava/
            build/tmp/compileClientJava/
          if-no-files-found: ignore

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: tacticalmod-jar
          path: dist

      - name: List files
        run: ls -la dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
